<!doctype html><html lang="en"><meta charset="utf-8"><title>Pulse local video checks</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#080808;color:white;font:16px system-ui;padding:24px}button,a{display:inline-block;background:#4a1010;color:white;border:1px solid #ff2424;padding:14px;margin:8px 8px 8px 0;border-radius:8px}video,canvas{display:block;width:220px;max-width:100%;margin:12px 0}pre{white-space:pre-wrap}h1{font-size:24px}</style><h1>Pulse local video checks</h1><p>Development tests only. No camera permission or network upload.</p><button id="run">Run isolated storage and recording tests</button><button id="seed">Insert temporary playback test into Pulse</button><button id="cleanup">Remove temporary test video</button><a href="../index.html#/library">Open Pulse Saved Videos</a><pre id="results" role="status"></pre><video id="playback" controls muted playsinline></video><canvas id="source" width="160" height="240"></canvas><script type="module">
import {VideoStore} from '../src/utils/video-store.js';
import {CameraSession} from '../src/utils/camera-session.js';
import {cameraSettings} from '../src/config/camera.js';
import {localVideoSettings} from '../src/config/local-videos.js';
const out=document.querySelector('#results'),player=document.querySelector('#playback');let fixture,seedId;
const log=t=>out.textContent+=t+'\n',check=(v,t)=>{if(!v)throw new Error(t);log('PASS · '+t)};
async function clip(){if(!fixture){const response=await fetch('./fixtures/playback-test.mp4');if(!response.ok)throw new Error('Place a small MP4 at tests/fixtures/playback-test.mp4 first.');fixture=new File([await response.blob()],'playback-test.mp4',{type:'video/mp4'})}return fixture}
async function play(blob){const url=URL.createObjectURL(blob);try{player.src=url;await player.play();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Playback did not advance')),8000);const poll=setInterval(()=>{if(player.currentTime>.05){clearTimeout(timer);clearInterval(poll);resolve()}},40)});check(player.videoWidth>0,'Saved blob decodes and replays');player.pause()}finally{player.removeAttribute('src');player.load();URL.revokeObjectURL(url)}}
document.querySelector('#run').onclick=async()=>{out.textContent='';const store=new VideoStore({settings:{...localVideoSettings,databaseName:'pulse-video-isolated-tests-'+Date.now()}});let camera;try{
const file=await clip(),item=await store.save(file,{sceneId:1,creator:'Test creator',source:'test',title:'Playback test'});check(!!item.id,'Imported video receives unique ID and creator/scene metadata');check((await store.get(item.id)).blob.size===file.size,'Imported bytes persist in IndexedDB');const same=await store.save(file,{sceneId:2,creator:'Test creator'});check(same.id===item.id&&(await store.list()).length===1,'Identical imports reuse one stored blob');await store.assign(item.id,1);await store.assign(item.id,19);check((await store.bindings()).length===2&&(await store.list()).length===1,'Two scene assignments share one video');await store.close();const reopened=await store.get(item.id);check(reopened.id===item.id,'Closing and reopening the database preserves recordings');await play(reopened.blob);
if(!globalThis.MediaRecorder||!document.querySelector('#source').captureStream)throw new Error('This browser cannot run the synthetic recorder test');const canvas=document.querySelector('#source'),context=canvas.getContext('2d');context.fillStyle='#080808';context.fillRect(0,0,160,240);const stream=canvas.captureStream(8);camera=new CameraSession(cameraSettings,()=>{},{devices:{getUserMedia:async()=>stream}});await camera.open({microphone:false});check(camera.mode==='preview','Recorder shows preview without starting automatically');check(camera.start(),'Native MediaRecorder starts with a supported format');const timer=setInterval(()=>{context.fillStyle=Date.now()%2?'#080808':'#101010';context.fillRect(0,0,160,240)},80);await new Promise(r=>setTimeout(r,600));camera.stop();await new Promise((resolve,reject)=>{const start=Date.now(),poll=setInterval(()=>{if(camera.mode==='review'){clearInterval(poll);resolve()}else if(Date.now()-start>8000){clearInterval(poll);reject(new Error('Recorder did not finish'))}},30)});clearInterval(timer);const recording=await store.save(camera.blob,{sceneId:9,creator:'Test creator',source:'test-recording'});camera.destroy();check((await store.get(recording.id)).blob.size>0,'Native recording saved after recorder cleanup');await play((await store.get(recording.id)).blob);check((await store.list()).length===2,'Independent takes keep separate IDs');await store.remove(item.id);check(!(await store.get(item.id))&&(await store.bindings()).length===0,'Delete removes only selected video and its assignments');check(!!(await store.get(recording.id)),'Deleting one take preserves another');await store.remove(recording.id);await store.close();log('ALL CHECKS PASSED');
}catch(error){log('FAIL · '+error.message);console.error(error)}finally{camera?.destroy();await store.close();indexedDB.deleteDatabase(store.settings.databaseName)}};
document.querySelector('#seed').onclick=async()=>{try{const store=new VideoStore(),item=await store.save(await clip(),{sceneId:1,creator:'Test creator',source:'test-fixture',title:'Playback test — temporary'});seedId=item.id;sessionStorage.setItem('pulse-test-fixture-id',seedId);log('Temporary test clip ready: '+seedId);await store.close()}catch(error){log('FAIL · '+error.message)}};
document.querySelector('#cleanup').onclick=async()=>{const store=new VideoStore();const items=(await store.list()).filter(item=>item.source==='test-fixture'&&item.title==='Playback test — temporary');for(const item of items)await store.remove(item.id);await store.close();sessionStorage.removeItem('pulse-test-fixture-id');log('Temporary test clip removed; other videos preserved')};
</script></html>
